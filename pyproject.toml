[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-maker"
version = "0.1.0"
description = "Rights-aware orchestration for adapting stories into movie production packages."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "minagayid"}]
dependencies = []

[project.scripts]
movie-maker = "movie_maker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
